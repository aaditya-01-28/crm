services:
  postgres:
    image: postgres:16-alpine
    container_name: textora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: textora
      POSTGRES_PASSWORD: textora_secret
      POSTGRES_DB: textora_engage
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: elestio/minio:latest
    container_name: textora_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: textora_minio
      MINIO_ROOT_PASSWORD: textora_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
